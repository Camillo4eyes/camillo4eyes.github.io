name: Update Scholar Data

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:   # allow manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_scholar.py'

permissions:
  contents: write

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # scholarly 1.7.x imports bibtexparser.bibdatabase, removed in bibtexparser 2.x
        run: pip install "scholarly==1.7.11" "bibtexparser<2"

      - name: Fetch Google Scholar data
        # Scholar sometimes throttles CI runners and scholarly retries for a long time;
        # give up after 10 minutes and keep the existing data.
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/fetch_scholar.py

      - name: Commit updated scholar-data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scholar-data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update scholar-data.json [skip ci]"
            git pull --rebase origin main
            git push
          fi
