<style>
/* Layout: one full-screen stage; pixel canvas centered and scaled, DOM overlays for text, touch pad pinned to the bottom corners. */
:root{
  --night:#0c0a11;      /* page and letterbox */
  --ink:#16121d;        /* panel fill */
  --paper:#eadfc4;      /* dialog text, like old cardboard */
  --dust:#9a90a8;       /* secondary text */
  --brass:#e2b24c;      /* the wind-up key, the one accent */
  --brass-dark:#8f6526;
  --wine:#7a2f3c;       /* danger, boss bar */
  --display:"Jacquard 12","Pixelify Sans",ui-monospace,monospace;
  --body:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--paper);overflow:hidden;
  font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#wrap{position:relative;flex:none}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.ov{position:absolute;inset:0;pointer-events:none}
.ov > *{pointer-events:auto}
[hidden]{display:none!important}

/* panels */
.panel{background:color-mix(in srgb,var(--ink) 92%,transparent);border:2px solid var(--brass-dark);
  box-shadow:0 0 0 2px var(--ink),0 0 0 4px #000a,inset 0 0 0 2px #0006;image-rendering:pixelated}
.btn{font:600 clamp(13px,2.2vmin,18px)/1 var(--body);color:var(--paper);background:transparent;border:2px solid transparent;
  padding:.55em 1.1em;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;min-height:44px}
.btn:hover,.btn:focus-visible,.btn.sel{border-color:var(--brass);color:var(--brass);outline:none}
.btn::before{content:"";display:inline-block;width:.5em}
.btn.sel::before,.btn:focus-visible::before{content:"\25B8";width:.5em;margin-right:.3em}
.btn:disabled{opacity:.35;cursor:default}

/* title */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;
  background:radial-gradient(ellipse at 50% 45%,#1d1828 0%,var(--night) 70%);text-align:center;padding:1em}
#title h1{font:400 clamp(56px,16vmin,150px)/.8 var(--display);margin:0;color:var(--paper);letter-spacing:.02em;
  text-shadow:0 4px 0 #000,0 0 30px #e2b24c33}
#title .sub{font-size:clamp(12px,2vmin,16px);color:var(--dust);letter-spacing:.12em;text-transform:uppercase;margin-top:-.4em}
#title .menu{display:flex;flex-direction:column;align-items:center;gap:.2em}
#title .langs{display:flex;gap:.4em;font-size:12px}
#title .hint{font-size:clamp(11px,1.7vmin,13px);color:var(--dust);max-width:46ch;line-height:1.5}
#keyart{width:min(120px,22vmin);image-rendering:pixelated}

/* dialog */
#dialog{position:absolute;left:4%;right:4%;bottom:5%;padding:.9em 1.2em 1.1em;min-height:5.4em}
#dialog .who{font:400 clamp(20px,3.6vmin,30px)/1 var(--display);color:var(--brass);margin-bottom:.25em}
#dialog .txt{font-size:clamp(13px,2.4vmin,19px);line-height:1.45;max-width:70ch;text-wrap:pretty}
#dialog .more{position:absolute;right:.9em;bottom:.5em;color:var(--brass);animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* card: item pickups and boss names */
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#card .inner{text-align:center;padding:1.2em 1.6em;max-width:min(560px,88%)}
#card .big{font:400 clamp(30px,7vmin,64px)/1 var(--display);color:var(--paper)}
#card .small{font-size:clamp(12px,2.2vmin,17px);color:var(--dust);margin-top:.4em;line-height:1.5}
#card.boss{background:none;pointer-events:none}
#card.boss .inner{background:none;border:none;box-shadow:none}
#card.boss .big{font-size:clamp(44px,11vmin,110px);text-shadow:0 4px 0 #000}
#card.boss .small{color:var(--brass);text-transform:uppercase;letter-spacing:.14em}
#card canvas{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto .6em}

#banner{position:absolute;top:16%;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s}
#banner.on{opacity:1}
#banner .a{font:400 clamp(30px,7vmin,60px)/1 var(--display);text-shadow:0 3px 0 #000}
#banner .r{font-size:clamp(11px,1.9vmin,15px);color:var(--dust);letter-spacing:.16em;text-transform:uppercase;margin-top:.3em}

#toast{position:absolute;top:4%;left:50%;transform:translateX(-50%);padding:.4em .9em;font-size:clamp(12px,2vmin,15px);
  color:var(--brass);pointer-events:none;transition:opacity .4s}

/* menus */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05040899}
.modal .box{padding:1em 1.4em;display:flex;flex-direction:column;gap:.15em;min-width:min(320px,86%);max-height:90%;overflow:auto}
.modal h2{font:400 clamp(28px,6vmin,48px)/1 var(--display);margin:.1em 0 .3em;color:var(--paper);text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:1em}
.shopitem{display:grid;grid-template-columns:1fr auto;gap:.1em 1em;text-align:left;text-transform:none;letter-spacing:0}
.shopitem .n{font-weight:600}
.shopitem .d{grid-column:1/-1;font-weight:400;color:var(--dust);font-size:.82em;line-height:1.35;white-space:normal}
.shopitem .p{color:var(--brass);font-variant-numeric:tabular-nums}
.wallet{text-align:center;color:var(--brass);margin-bottom:.4em;font-variant-numeric:tabular-nums}
.controls{font-size:clamp(11px,1.9vmin,14px);line-height:1.7;color:var(--paper)}
.controls b{color:var(--brass);font-weight:600}
#mapbox canvas{max-width:100%;image-rendering:pixelated;display:block;margin:0 auto}
#mapbox .legend{font-size:12px;color:var(--dust);text-align:center;margin-top:.5em}

/* story slides */
#slides{position:absolute;inset:0;background:var(--night);display:flex;align-items:center;justify-content:center;padding:1.5em;cursor:pointer}
#slides p{font-size:clamp(15px,3vmin,24px);line-height:1.6;max-width:36ch;text-align:center;margin:0;transition:opacity .6s;text-wrap:balance}
#slides .end{font:400 clamp(36px,9vmin,80px)/1 var(--display);color:var(--brass)}
#slides .tap{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-size:12px;color:var(--dust);letter-spacing:.14em;text-transform:uppercase}

/* touch controls */
#touch{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:5}
#touch > *{pointer-events:auto}
#stick{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;
  border:2px solid #e2b24c55;background:#0c0a1166;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#e2b24c55;border:2px solid #e2b24caa}
.tb{position:fixed;width:62px;height:62px;border-radius:50%;border:2px solid #eadfc455;background:#0c0a1177;color:var(--paper);
  font:600 11px/1 var(--body);display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.04em;touch-action:none}
.tb.on{background:#e2b24c66;border-color:var(--brass)}
.tb[data-b=jump]{width:76px;height:76px;right:calc(max(14px,env(safe-area-inset-right,0px)) + 0px);bottom:max(14px,env(safe-area-inset-bottom,0px))}
.tb[data-b=attack]{right:calc(max(14px,env(safe-area-inset-right,0px)) + 88px);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 8px)}
.tb[data-b=dash]{right:calc(max(14px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 90px)}
.tb[data-b=heal]{right:calc(max(14px,env(safe-area-inset-right,0px)) + 88px);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 82px)}
.tb.sm{width:44px;height:44px;font-size:10px}
.tb[data-b=map]{right:calc(max(12px,env(safe-area-inset-right,0px)) + 52px);top:calc(max(10px,env(safe-area-inset-top,0px)));bottom:auto}
.tb[data-b=pause]{right:max(12px,env(safe-area-inset-right,0px));top:calc(max(10px,env(safe-area-inset-top,0px)));bottom:auto}
@media (prefers-reduced-motion:reduce){#dialog .more{animation:none}#banner{transition:none}}
</style>

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function mk(rows){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const c=mkCanvas(w,h);const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch!=='.'&&PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1);}}return spr(c);}
function spr(c){const f=mkCanvas(c.width,c.height);const x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);
  return {r:c,l:f,w:c.width,h:c.height};}

function whiteOf(c){let f=flashCache.get(c);if(f)return f;f=mkCanvas(c.width,c.height);const x=f.getContext('2d');x.drawImage(c,0,0);

function mkSlash(r1,r2,len){const w=len,h=r2*2+2;const c=mkCanvas(w,h);const x=c.getContext('2d');const cx=-r2*0.25,cy=h/2;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const dx=i-cx,dy=j-cy;const d=Math.hypot(dx*0.8,dy);const t=Math.abs(dy)/(r2);
    if(d<r2&&d>r1+t*t*4&&dx>0){x.fillStyle=d>r2-2?'#fff':'#e9e3d5';x.fillRect(i,j,1,1);}}return spr(c);}

const AU={ctx:null,master:null,music:null,sfx:null,on:true,theme:null,step:0,next:0,timer:null,noise:null};
function audioInit(){if(AU.ctx)return;try{const A=window.AudioContext||window.webkitAudioContext;AU.ctx=new A();}catch(e){return;}
  const c=AU.ctx;AU.master=c.createGain();AU.master.gain.value=AU.on?0.9:0;AU.master.connect(c.destination);
  AU.music=c.createGain();AU.music.gain.value=0.32;AU.sfx=c.createGain();AU.sfx.gain.value=0.5;
  const dl=c.createDelay();dl.delayTime.value=0.33;const fb=c.createGain();fb.gain.value=0.32;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  AU.music.connect(AU.master);AU.music.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AU.master);AU.sfx.connect(AU.master);
  const nb=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
  AU.next=c.currentTime+0.1;AU.timer=setInterval(musicTick,30);}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,t,dur,type,vol,dest,glide){const c=AU.ctx;const o=c.createOscillator();const g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(Math.max(30,glide),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);}
function noise(t,dur,vol,freq,q){const c=AU.ctx;const s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t);s.stop(t+dur+0.02);}

function setTheme(name){if(AU.theme===name)return;AU.theme=name;AU.step=0;if(AU.ctx)AU.next=AU.ctx.currentTime+0.15;}
function musicTick(){const c=AU.ctx;if(!c||!AU.theme)return;const th=THEMES[AU.theme];if(!th||!th.mel.length)return;const sp=60/th.bpm/2;
  while(AU.next<c.currentTime+0.12){const i=AU.step%32;const m=th.mel[i%th.mel.length];const b=th.bass[i%th.bass.length];const t=AU.next;
    if(m){tone(mtof(m),t,0.9,'sine',0.16,AU.music);tone(mtof(m+12),t,0.35,'triangle',0.035,AU.music);}
    if(b){tone(mtof(b),t,th.drum?0.25:1.6,'triangle',th.drum?0.22:0.14,AU.music);}
    if(th.drum){if(i%4===0)tone(90,t,0.14,'sine',0.35,AU.music,40);if(i%4===2)noiseM(t);}

  Space:'jump',KeyZ:'jump',Enter:'confirm',KeyX:'attack',KeyJ:'attack',KeyC:'dash',KeyK:'dash',ShiftLeft:'dash',ShiftRight:'dash',
  KeyV:'heal',KeyL:'heal',KeyM:'map',Tab:'map',Escape:'pause',KeyP:'pause'};
const kb={},tc={},gp={};const IN={},PREV={};
const BTN=['left','right','up','down','jump','attack','dash','heal','map','pause','confirm'];
addEventListener('keydown',e=>{const b=KEYMAP[e.code];if(b){kb[b]=true;e.preventDefault();}audioInit();});
addEventListener('keyup',e=>{const b=KEYMAP[e.code];if(b){kb[b]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in kb)kb[k]=false;});
function pollPad(){for(const k of BTN)gp[k]=false;const pads=navigator.getGamepads?navigator.getGamepads():[];for(const p of pads){if(!p)continue;const b=i=>p.buttons[i]&&p.buttons[i].pressed;
  const ax=p.axes[0]||0,ay=p.axes[1]||0;gp.left=gp.left||b(14)||ax<-0.4;gp.right=gp.right||b(15)||ax>0.4;gp.up=gp.up||b(12)||ay<-0.5;gp.down=gp.down||b(13)||ay>0.5;
  gp.jump=gp.jump||b(0);gp.attack=gp.attack||b(2);gp.dash=gp.dash||b(1)||b(5)||b(7);gp.heal=gp.heal||b(3)||b(4)||b(6);gp.map=gp.map||b(8);gp.pause=gp.pause||b(9);
  if(Object.values(gp).some(v=>v))audioInit();}}
function readInput(){pollPad();for(const k of BTN){PREV[k]=IN[k];IN[k]=!!(kb[k]||tc[k]||gp[k]);}}
const pressed=k=>IN[k]&&!PREV[k];
const confirmPressed=()=>pressed('jump')||pressed('confirm')||pressed('attack');
// touch
function setupTouch(){const box=document.getElementById('touch');const show=()=>{box.hidden=false;};
  if(matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0)show();addEventListener('touchstart',show,{once:true,passive:true});
  const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null;
  const upd=e=>{const r=stick.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),mx=r.width*0.38;
    if(m>mx){dx*=mx/m;dy*=mx/m;}knob.style.transform=`translate(${dx}px,${dy}px)`;const t=r.width*0.16;tc.left=dx<-t;tc.right=dx>t;tc.up=dy<-t*1.6;tc.down=dy>t*1.6;};
  const end=()=>{sid=null;knob.style.transform='';tc.left=tc.right=tc.up=tc.down=false;};
  stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(e.pointerId);upd(e);audioInit();e.preventDefault();});
  stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)upd(e);});
  stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
  document.querySelectorAll('.tb').forEach(el=>{const b=el.dataset.b;const on=e=>{tc[b]=true;el.classList.add('on');el.setPointerCapture(e.pointerId);audioInit();e.preventDefault();};
    const off=()=>{tc[b]=false;el.classList.remove('on');};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);});}

// ===== ROOM =====
let room=null;
function parseRoom(id){const def=ROOMS[id];const g=def.map.map(r=>r.split(''));const h=g.length,w=g[0].length;
  const R={id,def,area:AREAS[def.area],areaKey:def.area,w,h,pw:w*TS,ph:h*TS,g,ents:[],npcs:[],props:[],items:[],links:{},gates:false,boss:null,bossState:'none',triggerX:null,spawn:null,start:null,lights:[]};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=g[y][x];const px=x*TS,py=y*TS;
    if(ch>='0'&&ch<='9'){(R.links[ch]=R.links[ch]||[]).push({x,y});continue;}
    let keep=false;
    switch(ch){
      case '#':case '=':case '^':case 'G':case 'H':keep=true;break;
      case '@':R.start={x:px+3,y:py+TS-14};break;
      case 'B':R.props.push({k:'bed',x:px-4,y:py+TS-11,w:24,h:11});R.lights.push({x:px+8,y:py+8,r:56});break;
      case 'K':R.props.push({k:'note',x:px+3,y:py+TS-11,w:10,h:11,lore:def.lore});R.lights.push({x:px+8,y:py+8,r:30});break;
      case 'P':R.npcs.push({k:'patch',x:px-2,y:py+TS-18});break;
      case 'M':R.npcs.push({k:'marla',x:px+1,y:py+TS-20});break;
      case 'T':R.npcs.push({k:'tin',x:px+3,y:py+TS-20});break;
      case 'L':R.npcs.push({k:'lop',x:px+1,y:py+TS-20});break;
      case '+':if(!S.flags['cog_'+id])R.items.push({k:'cog',x:px+3,y:py+3,flag:'cog_'+id});break;
      case '$':if(!S.flags['pouch_'+id])R.items.push({k:'pouch',x:px+3,y:py+5,flag:'pouch_'+id});break;
      case '*':R.itemSpot={x:px+2,y:py+2};break;
      case '&':R.spawn={x:px+8,y:py+TS};break;
      case 'X':R.triggerX=px+8;break;
      default:if('mtpjo'.includes(ch))R.ents.push(makeEnemy(ch,px,py));
    }
    if(!keep)g[y][x]='.';}
  if(def.item&&R.itemSpot&&!S.flags['item_'+id]&&!def.boss)R.items.push({k:def.item,x:R.itemSpot.x,y:R.itemSpot.y,flag:'item_'+id,ability:true});
  if(def.boss){if(S.flags['boss_'+def.boss]){R.bossState='dead';if(def.item&&!S.flags['item_'+id]&&R.itemSpot)R.items.push({k:def.item,x:R.itemSpot.x,y:R.itemSpot.y,flag:'item_'+id,ability:true});}
    else R.bossState='idle';}
  if(S.lost&&S.lost.room===id)R.items.push({k:'lost',x:S.lost.x,y:S.lost.y,amt:S.lost.amt});
  return R;}
function tileAt(tx,ty){if(tx<0||ty<0||tx>=room.w||ty>=room.h)return '#';return room.g[ty][tx];}
function isSolidCh(ch){return ch==='#'||(ch==='G'&&room.gates)||(ch==='H'&&!S.flags.hatch);}
function solidAt(px,py){return isSolidCh(tileAt(Math.floor(px/TS),Math.floor(py/TS)));}
function moveX(e,dx){e.x+=dx;e.hitWall=0;const t0=Math.floor(e.y/TS),t1=Math.floor((e.y+e.h-0.01)/TS);
  if(dx>0){const tx=Math.floor((e.x+e.w-0.01)/TS);for(let ty=t0;ty<=t1;ty++)if(isSolidCh(tileAt(tx,ty))){e.x=tx*TS-e.w;e.hitWall=1;return true;}}
  else if(dx<0){const tx=Math.floor(e.x/TS);for(let ty=t0;ty<=t1;ty++)if(isSolidCh(tileAt(tx,ty))){e.x=(tx+1)*TS;e.hitWall=-1;return true;}}return false;}
function moveY(e,dy){const ob=e.y+e.h;e.y+=dy;const l=Math.floor(e.x/TS),r=Math.floor((e.x+e.w-0.01)/TS);
  if(dy>0){const ty=Math.floor((e.y+e.h-0.01)/TS);for(let tx=l;tx<=r;tx++){const ch=tileAt(tx,ty);if(isSolidCh(ch)||(ch==='='&&ob<=ty*TS+0.01&&!e.drop)){e.y=ty*TS-e.h;return 1;}}}
  else if(dy<0){const ty=Math.floor(e.y/TS);for(let tx=l;tx<=r;tx++)if(isSolidCh(tileAt(tx,ty))){e.y=(ty+1)*TS;return -1;}}return 0;}
function groundBelow(e){const y=e.y+e.h+1;const ty=Math.floor(y/TS);for(const px of [e.x+1,e.x+e.w-1]){const ch=tileAt(Math.floor(px/TS),ty);if(isSolidCh(ch)||(ch==='='&&!e.drop&&e.y+e.h<=ty*TS+0.5))return true;}return false;}
function floorAhead(e,dir){const px=dir>0?e.x+e.w+1:e.x-1;const ty=Math.floor((e.y+e.h+2)/TS);const ch=tileAt(Math.floor(px/TS),ty);return isSolidCh(ch)||ch==='=';}

// ===== PLAYER =====
const P={x:0,y:0,w:10,h:14,vx:0,vy:0,face:1,ground:false,coyote:0,jbuf:0,canDouble:true,airDash:true,dashT:0,dashCD:0,wall:0,wallLock:0,
  atkT:0,atkCD:0,atkDir:'side',atkId:0,inv:0,healHold:0,healT:0,kbT:0,jumping:false,anim:0,safe:null,safeT:0,linkCD:0,nudge:0,nudgeT:0,drop:false,dropT:0,
  dead:false,respawnT:0,landT:0,hitIds:new Set()};
const fx={parts:[],proj:[],shake:0,hitstop:0,fade:0,fadeDir:0,afters:[],flash:0};
let cam={x:0,y:0};
const GRAV=0.42,MAXFALL=6.6,JUMPV=-7.05,RUN=2.15,DASHV=5.3,DJV=-6.45;
function part(x,y,vx,vy,life,col,size,grav){fx.parts.push({x,y,vx,vy,life,max:life,col,size:size||1,grav:grav||0});}
function burst(x,y,n,col,sp,grav){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,sp||2);part(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(14,30),col,Math.random()<0.3?2:1,grav||0.04);}}
function hurtPlayer(dmg,srcX,spike){if(P.inv>0||P.dead||P.respawnT>0||state!=='play')return;S.hp-=dmg;P.inv=spike?40:72;fx.hitstop=7;fx.shake=7;fx.flash=6;sfx('hurt');
  P.healT=0;P.dashT=0;burst(P.x+5,P.y+7,12,'#efe6d2',2.4);
  if(S.hp<=0){S.hp=0;die();return;}
  if(spike){P.respawnT=34;fx.fadeDir=1;}else{P.kbT=10;P.vx=(P.x+5<srcX?-1:1)*2.6;P.vy=-3.2;}}
function die(){P.dead=true;P.deadT=90;sfx('die');for(let i=0;i<14;i++)part(P.x+5,P.y+7,rnd(-2.5,2.5),rnd(-4,-1),rnd(40,70),i%2?'#c7cfd8':'#e2b24c',2,0.18);}
function playerUpdate(){
  if(P.dead){P.deadT--;if(P.deadT===40)fx.fadeDir=1;if(P.deadT<=0)respawnAtBench();return;}
  if(P.respawnT>0){P.respawnT--;if(P.respawnT===14){const sp=P.safe||P.entry;if(sp){P.x=sp.x;P.y=sp.y;}P.vx=P.vy=0;P.dashT=0;P.wall=0;fx.fadeDir=-1;}return;}
  const dir=(IN.right?1:0)-(IN.left?1:0);
  if(P.inv>0)P.inv--;if(P.atkCD>0)P.atkCD--;if(P.dashCD>0)P.dashCD--;if(P.linkCD>0)P.linkCD--;if(P.jbuf>0)P.jbuf--;if(P.coyote>0)P.coyote--;
  if(pressed('jump')){if(IN.down&&P.ground&&onPlatform()){P.drop=true;P.dropT=10;}else P.jbuf=7;}
  if(P.dropT>0){P.dropT--;if(P.dropT===0)P.drop=false;}
  // heal / spark
  if(IN.heal){P.healHold++;}
  const focusing=P.healHold>12&&P.ground&&S.wind>=33&&S.hp<S.maxhp&&P.dashT===0;
  if(focusing){P.healT++;P.vx=0;if(P.healT%6===0)part(P.x+rnd(0,10),P.y+14,0,-rnd(0.5,1.2),24,'#e2b24c',1,0);
    if(P.healT>=S.healTime){S.hp++;S.wind-=33;P.healT=0;sfx('heal');burst(P.x+5,P.y+6,14,'#ffe9a0',1.6,0);}}else P.healT=0;
  if(!IN.heal&&PREV.heal){if(P.healHold<=12&&S.ab.battery&&S.wind>=33){S.wind-=33;spark();}P.healHold=0;}
  if(!IN.heal)P.healHold=0;
  // dash
  if(pressed('dash')&&S.ab.spring&&P.dashCD===0&&P.dashT===0&&(P.ground||P.airDash||P.wall)){
    if(P.wall){P.face=-P.wall;P.wall=0;}else if(dir)P.face=dir;P.dashT=13;P.dashCD=24;if(!P.ground)P.airDash=false;sfx('dash');}
  if(P.dashT>0){P.dashT--;P.vx=P.face*DASHV;P.vy=0;if(P.dashT%2===0)fx.afters.push({x:P.x,y:P.y,face:P.face,life:12});}
  else if(P.kbT>0){P.kbT--;}
  else if(P.wallLock>0){P.wallLock--;}
  else if(!focusing){P.vx=dir*RUN;if(dir&&P.atkT<=0)P.face=dir;else if(dir)P.face=dir;}
  // gravity
  if(P.dashT===0){P.vy+=GRAV;if(P.vy>MAXFALL)P.vy=MAXFALL;if(P.wall&&P.vy>1.25)P.vy=1.25;}
  if(P.jumping&&!IN.jump&&P.vy<-1){P.vy*=0.45;P.jumping=false;}if(P.vy>=0)P.jumping=false;
  // jumps
  if(P.jbuf>0&&P.dashT===0){
    if(P.ground||P.coyote>0){P.vy=JUMPV;P.ground=false;P.coyote=0;P.jbuf=0;P.jumping=true;sfx('jump');}
    else if(P.wall&&S.ab.velcro){P.vy=-6.7;P.vx=-P.wall*3.1;P.face=-P.wall;P.wallLock=9;P.wall=0;P.jbuf=0;P.jumping=true;P.canDouble=true;P.airDash=true;sfx('jump');
      for(let i=0;i<5;i++)part(P.x+(P.face>0?0:10),P.y+10,P.face*rnd(0.3,1),rnd(-0.6,0.6),18,'#c7cfd8');}
    else if(S.ab.balloon&&P.canDouble){P.vy=DJV;P.canDouble=false;P.jbuf=0;P.jumping=true;sfx('djump');
      for(let i=0;i<8;i++)part(P.x+5,P.y+14,rnd(-1.2,1.2),rnd(0.2,1),20,'#efe6d2');}
  }
  // attack
  if(pressed('attack')&&S.ab.pin&&P.atkCD===0&&P.dashT===0){P.atkDir=IN.up?'up':(IN.down&&!P.ground)?'down':'side';P.atkT=11;P.atkCD=16;P.atkId++;P.hitIds.clear();P.healT=0;sfx('slash');}
  if(P.atkT>0){P.atkT--;if(P.atkT>=4)attackHits();}
  // move
  const wasGround=P.ground;
  moveX(P,P.vx);const hitWallDir=P.hitWall;
  const r=moveY(P,P.vy);

  else if(r===-1){P.vy=0.5;const tx=Math.floor((P.x+5)/TS),ty=Math.floor((P.y-1)/TS);if(tileAt(tx,ty)==='H'&&!S.flags.hatch)toast(T('needUp'));}
  P.ground=groundBelow(P)&&P.vy>=0;

  // wall cling

  else if(P.ground||!S.ab.velcro)P.wall=0;
  if(P.wall&&P.anim%5===0)part(P.wall>0?P.x+10:P.x,P.y+12,0,-0.3,10,'#9a90a8');
  // hazards
  if(spikeTouch())hurtPlayer(1,P.x,true);
  // safe spot
  if(P.ground&&!onPlatform()&&++P.safeT>8){const l=Math.floor(P.x/TS),rr=Math.floor((P.x+P.w)/TS),ty=Math.floor((P.y+P.h+2)/TS);
    let ok=true;for(let tx=l-1;tx<=rr+1;tx++){if(tileAt(tx,ty)==='^'||tileAt(tx,ty-1)==='^')ok=false;}if(ok&&!room.ents.some(e=>Math.abs(e.x-P.x)<40&&Math.abs(e.y-P.y)<30))P.safe={x:P.x,y:P.y};P.safeT=0;}
  // nudge after rising through a floor hole
  if(P.nudgeT>0){P.nudgeT--;if(!dir&&!P.ground)moveX(P,P.nudge*1.6);}
  P.anim++;
  checkLinks();
}
function onPlatform(){const ty=Math.floor((P.y+P.h+1)/TS);const a=tileAt(Math.floor((P.x+1)/TS),ty),b=tileAt(Math.floor((P.x+P.w-1)/TS),ty);return (a==='='||a==='.')&&(b==='='||b==='.')&&(a==='='||b==='=');}
function wallTouch(){for(const side of [1,-1]){const px=side>0?P.x+P.w+1:P.x-1;if(solidAt(px,P.y+3)&&solidAt(px,P.y+P.h-3))return side;}return 0;}
function spikeTouch(){const box={x:P.x+2,y:P.y+4,w:P.w-4,h:P.h-4};const l=Math.floor(box.x/TS),r=Math.floor((box.x+box.w)/TS),t=Math.floor(box.y/TS),b=Math.floor((box.y+box.h)/TS);
  for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++)if(tileAt(tx,ty)==='^'&&overlap(box,{x:tx*TS,y:ty*TS+8,w:TS,h:8}))return true;return false;}
function atkBox(){const cx=P.x+P.w/2,cy=P.y+P.h/2;if(P.atkDir==='up')return {x:cx-9,y:P.y-22,w:18,h:24};if(P.atkDir==='down')return {x:cx-9,y:P.y+P.h-2,w:18,h:24};
  return P.face>0?{x:P.x+P.w-2,y:cy-10,w:24,h:20}:{x:P.x-22,y:cy-10,w:24,h:20};}
function attackHits(){const box=atkBox();let pogo=false,landed=false;
  const targets=room.ents.slice();if(room.boss&&!room.boss.dead)targets.push(room.boss);
  for(const e of targets){if(e.dead||P.hitIds.has(e))continue;if(overlap(box,e)&&!e.intangible){P.hitIds.add(e);damageEnemy(e,S.dmg,P.atkDir==='side'?P.face:0);landed=true;if(P.atkDir==='down')pogo=true;}}
  for(const pr of fx.proj){if(pr.parry&&!pr.dead&&overlap(box,pr)){pr.dead=true;burst(pr.x,pr.y,6,'#fff',1.5);landed=true;if(P.atkDir==='down')pogo=true;}}
  if(P.atkDir==='down'&&!pogo){const l=Math.floor(box.x/TS),r=Math.floor((box.x+box.w)/TS),t=Math.floor(box.y/TS),b=Math.floor((box.y+box.h)/TS);
    for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++)if(tileAt(tx,ty)==='^'){pogo=true;}}
  if(P.atkDir==='up'&&!S.flags.hatch){const l=Math.floor(box.x/TS),r=Math.floor((box.x+box.w)/TS),t=Math.floor(box.y/TS);
    for(let tx=l;tx<=r;tx++)for(let ty=t;ty<=t+1;ty++)if(tileAt(tx,ty)==='H'){S.flags.hatch=1;sfx('break');fx.shake=8;burst(tx*TS+8,ty*TS+8,20,'#7d4a38',2.5,0.15);}}
  if(pogo&&!P.pogoed){P.pogoed=true;P.vy=-6.3;P.jumping=false;P.canDouble=true;P.airDash=true;P.dashT=0;}
  if(P.atkT===10)P.pogoed=false;
  if(landed&&P.atkDir==='side'&&!P.recoiled){P.recoiled=true;if(P.ground)moveX(P,-P.face*3);}
  if(P.atkT<=4)P.recoiled=false;}
function damageEnemy(e,dmg,dir){if(e.dead)return;e.hp-=dmg;e.flash=7;fx.hitstop=Math.max(fx.hitstop,3);sfx('hit');S.wind=Math.min(99,S.wind+11);
  burst(e.x+e.w/2,e.y+e.h/2,6,'#efe6d2',2);
  if(!e.heavy&&dir){e.kx=dir*2.4;}
  if(e.hp<=0){e.dead=true;if(e.onDeath)e.onDeath();else killEnemy(e);}}
function killEnemy(e){burst(e.x+e.w/2,e.y+e.h/2,14,e.col||'#c7cfd8',2.4,0.12);dropButtons(e.x+e.w/2,e.y+e.h/2,e.loot||3);}
function dropButtons(x,y,n){for(let i=0;i<n;i++)room.items.push({k:'btn',x:x-3,y:y-3,vx:rnd(-1.6,1.6),vy:rnd(-3.5,-1.5),t:0,phys:true});}
function spark(){sfx('spark');fx.proj.push({x:P.x+(P.face>0?P.w:-8),y:P.y+4,w:8,h:6,vx:P.face*5.4,vy:0,friendly:true,dmg:S.dmg>1?4:3,life:70,k:'spark',hits:new Set()});P.vx=-P.face*1;}

// ===== LINKS & TRANSITIONS =====
function linkEdge(R,cells){const c=cells[0];if(c.x===0)return 'L';if(c.x===R.w-1)return 'R';if(c.y===0)return 'T';return 'B';}
let pendingLink=null;
function checkLinks(){if(P.linkCD>0||pendingLink)return;const cx=P.x+P.w/2,cy=P.y+P.h/2;
  for(const pt of [[cx,cy],[cx,P.y+P.h-1],[cx,P.y+1],[P.x+1,cy],[P.x+P.w-1,cy]]){const tx=Math.floor(pt[0]/TS),ty=Math.floor(pt[1]/TS);
    for(const d in room.links){if(room.links[d].some(c=>c.x===tx&&c.y===ty)){startLink(d);return;}}}}
function startLink(d){const cells=room.links[d];const edge=linkEdge(room,cells);const minx=Math.min(...cells.map(c=>c.x));

function drawParts(){const cx=cam.x,cy=cam.y;for(const p of fx.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.97;p.life--;ctx.globalAlpha=Math.min(1,p.life/p.max*1.6);ctx.fillStyle=p.col;

function drawNum(n,x,y,col){const s=String(n);ctx.fillStyle=col;for(let i=0;i<s.length;i++){const d=DIG[+s[i]];for(let j=0;j<15;j++)if(d[j]==='1')ctx.fillRect(x+i*4+(j%3),y+Math.floor(j/3),1,1);}}

let frame=0;
// ===== ENEMIES =====
function makeEnemy(ch,px,py){
  switch(ch){
  case 'm':return {k:'mouse',x:px+2,y:py+TS-9,w:13,h:9,vx:0.7*(Math.random()<0.5?-1:1),vy:0,hp:2,loot:3,col:'#8d8a94',t:0};
  case 't':return {k:'top',x:px+2,y:py+TS-12,w:11,h:12,vx:0,vy:0,hp:3,loot:5,col:'#b5473c',t:60,st:'rest',dir:1};
  case 'p':return {k:'plane',x:px+1,y:py+4,w:12,h:7,vx:0,vy:0,hp:1,loot:3,col:'#efe6d2',hx:px,hy:py,ang:0,t:Math.random()*100,fly:true};
  case 'j':return {k:'jack',x:px+1,y:py+TS-10,w:14,h:10,vx:0,vy:0,hp:3,loot:6,col:'#4f6fa8',t:60+Math.floor(Math.random()*60),open:0,heavy:true};
  case 'o':return {k:'moth',x:px+1,y:py+3,w:12,h:9,vx:0,vy:0,hp:2,loot:4,col:'#8a6aa8',t:Math.random()*100,fly:true};
  }}
function enemyPhys(e){e.vy+=GRAV;if(e.vy>MAXFALL)e.vy=MAXFALL;moveX(e,e.vx+(e.kx||0));if(moveY(e,e.vy))e.vy=0;if(e.kx){e.kx*=0.8;if(Math.abs(e.kx)<0.1)e.kx=0;}}
function pdx(e){return (P.x+P.w/2)-(e.x+e.w/2);}function pdy(e){return (P.y+P.h/2)-(e.y+e.h/2);}
function updateEnemy(e){e.t++;if(e.flash>0)e.flash--;
  switch(e.k){
  case 'mouse':{const d=sign(e.vx)||1;if(e.hitWall||(groundBelow(e)&&!floorAhead(e,d)))e.vx=-e.vx;enemyPhys(e);if(e.hitWall)e.vx=-(e.hitWall)*0.7;
    if(e.t%140===0&&Math.abs(pdx(e))<150)sfx('squeak');break;}
  case 'top':{if(e.st==='rest'){e.vx=0;if(--e.t2<=0||e.t2===undefined){e.t2=0;}if(e.t>40&&Math.abs(pdx(e))<120&&Math.abs(pdy(e))<28){e.st='wind';e.t=0;e.dir=sign(pdx(e))||1;}}
    else if(e.st==='wind'){e.vx=0;if(e.t>22){e.st='go';e.t=0;}}
    else if(e.st==='go'){e.vx=e.dir*3.1;if(e.hitWall||!floorAhead(e,e.dir)||e.t>55){e.st='rest';e.t=0;e.vx=0;}}
    enemyPhys(e);break;}
  case 'plane':{const dx=pdx(e),dy=pdy(e),dist=Math.hypot(dx,dy);
    if(dist<140){const want=Math.atan2(dy,dx);let da=want-e.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;e.ang+=clamp(da,-0.045,0.045);
      e.vx=Math.cos(e.ang)*1.55;e.vy=Math.sin(e.ang)*1.55;}else{e.vx=Math.cos(e.t/50)*0.4;e.vy=Math.sin(e.t/35)*0.3;e.ang=e.vx<0?Math.PI:0;}
    moveX(e,e.vx+(e.kx||0));if(e.hitWall){e.ang=Math.PI-e.ang;}if(moveY(e,e.vy))e.ang=-e.ang;if(e.kx)e.kx*=0.85;break;}
  case 'jack':{if(e.open>0){e.open--;if(e.open===34){sfx('pop');const dx=pdx(e);fx.proj.push({x:e.x+5,y:e.y-14,w:6,h:6,vx:clamp(dx/48,-2.6,2.6),vy:-5.2,grav:0.2,k:'ball',dmg:1,life:200,parry:true});}}
    else if(--e.t<=0){e.open=50;e.t=110+Math.floor(Math.random()*40);}enemyPhys(e);e.kx=0;break;}
  case 'moth':{const dx=pdx(e),dy=pdy(e);if(Math.hypot(dx,dy)<170){e.vx+=sign(dx)*0.05;e.vy+=sign(dy-8)*0.04;}e.vx*=0.97;e.vy*=0.97;e.vx=clamp(e.vx,-1.1,1.1);e.vy=clamp(e.vy+Math.sin(e.t/9)*0.06,-1,1);
    moveX(e,e.vx+(e.kx||0));if(e.hitWall)e.vx=-e.vx;if(moveY(e,e.vy))e.vy=-e.vy;if(e.kx)e.kx*=0.85;if(e.t%7===0)part(e.x+6,e.y+5,rnd(-0.2,0.2),0.3,24,'#8a6aa8');break;}
  }
  if(!P.dead&&overlap(e,{x:P.x+1,y:P.y+1,w:P.w-2,h:P.h-1}))hurtPlayer(1,e.x+e.w/2);}
function drawEnemy(e){const cx=Math.round(cam.x),cy=Math.round(cam.y),f=e.flash>0;
  switch(e.k){
  case 'mouse':drawSpr(SP.mouse[Math.floor(e.t/8)%2],e.x-2-cx,e.y-1-cy,e.vx<0,f);break;
  case 'top':{const s=SP.top[Math.floor(e.t/(e.st==='go'?2:e.st==='wind'?3:8))%2];drawSpr(s,e.x-cx+(e.st==='wind'?(e.t%2?1:-1):0),e.y-cy,false,f);break;}
  case 'plane':{ctx.save();ctx.translate(Math.round(e.x+6-cx),Math.round(e.y+4-cy));const left=Math.cos(e.ang)<0;ctx.rotate(left?e.ang-Math.PI:e.ang);
    ctx.drawImage(f?whiteOf(left?SP.plane.l:SP.plane.r):(left?SP.plane.l:SP.plane.r),-7,-4);ctx.restore();break;}
  case 'jack':{const o=e.open;let hy=0;if(o>0){hy=o>34?(50-o)*1.4:o>8?22:o*2.7;}
    if(hy>0){ctx.fillStyle=PAL.S;for(let i=0;i<hy;i+=3)ctx.fillRect(e.x+6-cx+(i%6?1:-1),e.y-cy-i,2,2);drawSpr(SP.jackhead,e.x+2-cx,e.y-cy-hy-8,false,f);}
    drawSpr(SP.jackbox,e.x-cx,e.y-cy,false,f);if(!hy){ctx.fillStyle=PAL.U;ctx.fillRect(e.x-cx-1,e.y-cy-1,16,2);}break;}
  case 'moth':drawSpr(SP.moth[Math.floor(e.t/6)%2],e.x-1-cx,e.y-1-cy,false,f);break;
  }}

// ===== PROJECTILES =====
function updateProj(){for(const p of fx.proj){if(p.dead)continue;p.life--;if(p.life<=0){p.dead=true;continue;}
  if(p.warn>0){p.warn--;continue;}
  if(p.grav)p.vy+=p.grav;p.x+=p.vx;p.y+=p.vy;
  if(p.k==='wave'||p.k==='blade'){if(p.k==='blade'&&frame%3===0)part(p.x+p.w/2,p.y+p.h,rnd(-1,1),-rnd(0.5,1.5),10,'#ffe9a0');
    if(solidAt(p.x+(p.vx>0?p.w:0),p.y+p.h/2)){p.dead=true;burst(p.x,p.y+4,6,'#efe6d2',1.2);}}
  else if(p.k==='puddle'){}
  else if(solidAt(p.x+p.w/2,p.y+p.h/2)){p.dead=true;
    if(p.k==='ink'){fx.proj.push({x:p.x-8,y:Math.floor((p.y+p.h/2)/TS)*TS-4,w:22,h:4,vx:0,vy:0,k:'puddle',dmg:1,life:110});}
    burst(p.x+p.w/2,p.y+p.h/2,6,p.k==='spark'?'#ffe9a0':p.k==='coal'?'#ff9a4a':'#c7cfd8',1.5);continue;}
  if(p.friendly){const targets=room.ents.slice();if(room.boss&&!room.boss.dead)targets.push(room.boss);
    for(const e of targets){if(!e.dead&&!p.hits.has(e)&&!e.intangible&&overlap(p,e)){p.hits.add(e);damageEnemy(e,p.dmg,sign(p.vx));S.wind=Math.max(0,S.wind-11);}}
    if(frame%2===0)part(p.x+4,p.y+3,-p.vx*0.1,rnd(-0.5,0.5),12,'#ffe9a0');}
  else if(!P.dead&&overlap(p,{x:P.x+2,y:P.y+2,w:P.w-4,h:P.h-3}))hurtPlayer(p.dmg||1,p.x+p.w/2);}
  fx.proj=fx.proj.filter(p=>!p.dead);}
function drawProj(){const cx=Math.round(cam.x),cy=Math.round(cam.y);for(const p of fx.proj){const x=Math.round(p.x-cx),y=Math.round(p.y-cy);
  switch(p.k){
  case 'spark':ctx.fillStyle='#ffe9a0';ctx.fillRect(x,y+1,8,4);ctx.fillStyle='#fff';ctx.fillRect(x+2,y,4,6);break;
  case 'ball':ctx.fillStyle=PAL.k;ctx.fillRect(x-1,y-1,8,8);ctx.fillStyle=PAL.r;ctx.fillRect(x,y,6,6);ctx.fillStyle=PAL.w;ctx.fillRect(x+1,y+1,2,2);break;
  case 'wave':ctx.fillStyle='#efe6d2';ctx.fillRect(x,y+p.h-3,p.w,3);ctx.fillStyle='#c7cfd8';for(let i=0;i<p.w;i+=3)ctx.fillRect(x+i,y+(i*7+frame)%4,2,p.h-3);break;
  case 'coal':if(p.warn>0){ctx.fillStyle=frame%8<4?'#ff9a4a':'#7a2c2a';ctx.fillRect(x-2,p.groundY-cy-2,p.w+4,2);break;}
    ctx.fillStyle='#17121c';ctx.fillRect(x-1,y-1,p.w+2,p.h+2);ctx.fillStyle='#3a2a22';ctx.fillRect(x,y,p.w,p.h);ctx.fillStyle='#ff9a4a';ctx.fillRect(x+1,y+p.h-2,p.w-2,1);break;
  case 'dart':ctx.save();ctx.translate(x+3,y+3);ctx.rotate(Math.atan2(p.vy,p.vx));ctx.fillStyle='#efe6d2';ctx.fillRect(-5,-1,10,3);ctx.fillStyle='#17121c';ctx.fillRect(3,-1,2,3);ctx.restore();break;
  case 'ink':ctx.fillStyle='#17121c';ctx.fillRect(x,y,p.w,p.h);ctx.fillStyle='#2b2f4a';ctx.fillRect(x+1,y+1,2,2);break;
  case 'puddle':ctx.fillStyle='#17121c';ctx.fillRect(x,y+1,p.w,3);ctx.fillStyle='#2b2f4a';ctx.fillRect(x+3,y,p.w-6,1);if(frame%10===0)part(p.x+rnd(0,p.w),p.y,0,-0.4,18,'#2b2f4a');break;
  case 'note':{ctx.fillStyle=p.p2?'#ff8fa3':'#ffe9a0';ctx.fillRect(x+2,y+3,4,3);ctx.fillRect(x+5,y-2,1,5);ctx.fillRect(x+5,y-2,3,1);break;}
  case 'blade':{ctx.save();ctx.translate(x+p.w/2,y+p.h/2);ctx.rotate(frame*0.4*sign(p.vx));ctx.fillStyle='#c7cfd8';for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.fillRect(-1,-p.h/2,2,p.h/2);}
    ctx.fillStyle='#e2b24c';ctx.fillRect(-2,-2,4,4);ctx.restore();break;}
  }}}

// ===== ITEMS & PROPS =====
function updateItems(){for(const it of room.items){if(it.gone)continue;
  if(it.k==='btn'){it.t++;if(it.phys){it.vy+=0.25;const b={x:it.x,y:it.y,w:6,h:6};moveX(b,it.vx);if(b.hitWall)it.vx=-it.vx*0.5;const r=moveY(b,it.vy);it.x=b.x;it.y=b.y;if(r===1){it.vy=-it.vy*0.35;it.vx*=0.7;if(Math.abs(it.vy)<0.6)it.vy=0;}else if(r===-1)it.vy=0;}
    const dx=P.x+5-(it.x+3),dy=P.y+7-(it.y+3);const d=Math.hypot(dx,dy);if(it.t>24&&d<46){it.phys=false;it.x+=dx/d*3.2;it.y+=dy/d*3.2;}
    if(d<9&&it.t>10){it.gone=true;S.buttons++;sfx('coin');}continue;}
  const box={x:it.x,y:it.y,w:12,h:12};if(!P.dead&&overlap(box,P)){
    if(it.k==='lost'){it.gone=true;S.buttons+=it.amt;S.lost=null;sfx('pickup');toast(T('recovered'));burst(it.x+5,it.y+5,16,'#e2b24c',2);continue;}
    if(it.k==='pouch'){it.gone=true;S.flags[it.flag]=1;dropButtons(it.x+5,it.y,24);sfx('pickup');continue;}
    it.gone=true;S.flags[it.flag]=1;grantItem(it.k);}}
  room.items=room.items.filter(i=>!i.gone);}
function grantItem(k){sfx('pickup');fx.flash=10;
  if(k==='cog'){S.maxhp++;S.hp=S.maxhp;}else S.ab[k]=1;
  burst(P.x+5,P.y+6,24,'#ffe9a0',2.6,0);showCard(k,T('items')[k][0],T('items')[k][1]);writeSaveSoft();}
function writeSaveSoft(){/* items persist via flags; the room you saved in stays the bench */writeSave();}
function iconFor(k){return {cog:SP.cog,spring:SP.spring,battery:SP.battery,velcro:SP.velcro,balloon:SP.balloon,pin:SP.pin,pouch:SP.pouch}[k];}
function drawItems(){const cx=Math.round(cam.x),cy=Math.round(cam.y);for(const it of room.items){
  if(it.k==='btn'){ctx.drawImage(SP.button.r,Math.round(it.x-cx),Math.round(it.y-cy));continue;}
  const bob=Math.round(Math.sin(frame/18)*2);
  if(it.k==='lost'){ctx.globalAlpha=0.6+0.3*Math.sin(frame/10);ctx.drawImage(SP.pouch.r,it.x-cx,it.y-cy+bob);ctx.globalAlpha=1;if(frame%9===0)part(it.x+5,it.y+4,rnd(-0.3,0.3),-0.5,30,'#9a90a8');continue;}
  const ic=iconFor(it.k);ctx.fillStyle='#ffe9a022';ctx.beginPath();ctx.arc(it.x+6-cx,it.y+6-cy+bob,9+Math.sin(frame/10),0,Math.PI*2);ctx.fill();
  ctx.drawImage(ic.r,Math.round(it.x+6-ic.w/2-cx),Math.round(it.y+6-ic.h/2-cy+bob));if(frame%12===0)part(it.x+6+rnd(-5,5),it.y+8,0,-0.5,26,'#ffe9a0');}}
function drawProps(){const cx=Math.round(cam.x),cy=Math.round(cam.y);for(const p of room.props){
  if(p.k==='bed'){ctx.drawImage(SP.bed.r,p.x-cx,p.y-cy);if(nearProp(p))prompt(p.x+12,p.y-6);}
  else if(p.k==='note'){ctx.drawImage(SP.note.r,p.x-cx,p.y-cy);if(nearProp(p))prompt(p.x+5,p.y-6);}}
  for(const n of room.npcs){const s=SP[n.k];const b=(n.k==='tin')?0:Math.floor(frame/40)%2;const fl=n.k!=='tin'&&P.x<n.x;drawSpr(s,n.x-cx,n.y-cy+b,fl);
    if(Math.abs(P.x+5-(n.x+s.w/2))<26&&Math.abs(P.y+14-(n.y+s.h))<20)prompt(n.x+s.w/2,n.y-6);}}
function nearProp(p){return Math.abs(P.x+5-(p.x+p.w/2))<16&&Math.abs(P.y+14-(p.y+p.h))<14;}
function prompt(x,y){if(state!=='play')return;const cx=Math.round(cam.x),cy=Math.round(cam.y);const b=Math.floor(frame/20)%2;ctx.fillStyle='#17121c';ctx.fillRect(x-4-cx,y-6-cy-b,9,7);
  ctx.fillStyle='#e2b24c';ctx.fillRect(x-cx,y-5-cy-b,1,1);ctx.fillRect(x-1-cx,y-4-cy-b,3,1);ctx.fillRect(x-2-cx,y-3-cy-b,5,1);ctx.fillRect(x-3-cx,y-2-cy-b,7,1);}
function tryInteract(){if(!pressed('up')||!P.ground||P.atkT>0)return false;
  for(const n of room.npcs){const s=SP[n.k];if(Math.abs(P.x+5-(n.x+s.w/2))<26&&Math.abs(P.y+14-(n.y+s.h))<20){talkTo(n.k);return true;}}
  for(const p of room.props){if(!nearProp(p))continue;
    if(p.k==='bed'){rest(p);return true;}
    if(p.k==='note'){startDialog(T('names').note,[T('lore')[p.lore]]);return true;}}
  return false;}
function rest(p){S.hp=S.maxhp;S.bench={room:room.id,x:p.x+7,y:p.y+11-P.h};sfx('rest');burst(p.x+12,p.y,16,'#ffe9a0',1.2,0);room.ents=parseRoom(room.id).ents;
  writeSave();toast(T('rested'));}
function talkTo(k){const F=S.flags;let key,after=null;
  if(k==='patch'){if(!F.patchMet){key='patch0';after=()=>{F.patchMet=1;S.ab.pin=1;showCard('pin',T('items').pin[0],T('items').pin[1]);writeSave();};}
    else key=S.ab.balloon?'patch4':S.ab.velcro?'patch3':S.ab.spring?'patch2':'patch1';}
  else if(k==='marla'){key=F.marlaMet?'marla1':'marla0';after=()=>{F.marlaMet=1;openShop();};}
  else if(k==='tin'){key=F.boss_ratchet?'tin1':'tin0';}
  else if(k==='lop'){if(F.boss_folio){key=F.lop1?'lop2':'lop1';F.lop1=1;}else key='lop0';}
  startDialog(T('names')[k],T('talk')[key],after);}

// ===== BOSSES =====
const BOSSES={};
function spawnBoss(){const kind=room.def.boss;const sp=room.spawn;const b=BOSSES[kind](sp.x,sp.y);b.kind=kind;b.maxhp=b.hp;b.flash=0;b.t=0;b.heavy=true;
  room.boss=b;room.bossState='active';room.gates=true;sfx('gate');sfx('boss');fx.shake=12;setTheme(kind==='prima'?'prima':'boss');
  const nm=T('bosses')[kind];bossCard(nm[0],nm[1]);}
function bossDefeated(b){b.dead=true;b.dying=90;fx.shake=16;fx.hitstop=20;sfx('boss');S.flags['boss_'+b.kind]=1;}
function bossFinish(b){room.bossState='dead';room.gates=false;sfx('gate');setTheme(room.area.music);dropButtons(b.x+b.w/2,b.y+b.h/2,b.kind==='prima'?0:40);
  if(room.def.item&&room.itemSpot&&!S.flags['item_'+room.id])room.items.push({k:room.def.item,x:room.itemSpot.x,y:room.itemSpot.y,flag:'item_'+room.id,ability:true});
  room.ents.forEach(e=>{if(!e.dead){e.dead=true;killEnemy(e);}});
  if(b.kind==='prima')primaEnding();}
function bossCommon(b){if(b.flash>0)b.flash--;b.t++;if(!b.intangible&&!P.dead&&overlap({x:b.x+3,y:b.y+3,w:b.w-6,h:b.h-4},{x:P.x+1,y:P.y+1,w:P.w-2,h:P.h-1}))hurtPlayer(b.dmg||1,b.x+b.w/2);}
function bossFloor(b){b.vy=(b.vy||0)+GRAV;if(b.vy>8)b.vy=8;moveX(b,b.vx);const r=moveY(b,b.vy);if(r===1){const was=b.vy;b.vy=0;return was;}return 0;}
function pcx(){return P.x+P.w/2;}
function choose(b,list){b.last=list.filter(s=>s!==b.last||list.length===1)[Math.floor(Math.random()*(list.length>1?list.length-1:1))]||list[0];return b.last;}

// Ratchet, the Mouse King

// item card
function showCard(icon,big,small,cb){state='card';cardT=24;cardCb=cb||null;const c=$('card');c.className='';c.hidden=false;c.querySelector('.big').textContent=big;c.querySelector('.small').textContent=small;
  const cv2=c.querySelector('canvas');const ic=iconFor(icon);cv2.hidden=!ic;if(ic){cv2.width=ic.w;cv2.height=ic.h;const x=cv2.getContext('2d');x.clearRect(0,0,ic.w,ic.h);x.drawImage(ic.r,0,0);}}
function cardUpdate(){if(cardT>0){cardT--;return;}if(confirmPressed()||pressed('up'))closeCard();}
function closeCard(){if(cardT>0)return;$('card').hidden=true;state='play';const cb=cardCb;cardCb=null;if(cb)cb();}
$('card').addEventListener('pointerdown',e=>{if(state==='card'){closeCard();e.preventDefault();}});
let bossCardT=0;
function bossCard(a,b){const c=$('card');c.className='boss';c.hidden=false;c.querySelector('canvas').hidden=true;c.querySelector('.big').textContent=a;c.querySelector('.small').textContent=b;bossCardT=170;}
// generic menu
function openMenu(title,items,opts){opts=opts||{};menu={items,i:items.findIndex(it=>!it.disabled),back:opts.back};if(menu.i<0)menu.i=0;const box=$('modalbox');box.innerHTML='';
  if(title){const h=document.createElement('h2');h.textContent=title;box.appendChild(h);}
  if(opts.html){const d=document.createElement('div');d.innerHTML=opts.html;box.appendChild(d);}
  items.forEach((it,idx)=>{const b=document.createElement('button');b.className='btn'+(it.cls?' '+it.cls:'');if(it.html)b.innerHTML=it.html;else b.textContent=it.label;b.disabled=!!it.disabled;
    b.addEventListener('click',()=>{if(it.disabled)return;menu.i=idx;sfx('menu');it.action();});b.addEventListener('pointerenter',()=>{if(!it.disabled){menu.i=idx;markSel();}});box.appendChild(b);it.el=b;});
  $('modal').hidden=false;markSel();}
function closeMenu(){$('modal').hidden=true;menu=null;}
function markSel(){if(!menu)return;menu.items.forEach((it,i)=>it.el&&it.el.classList.toggle('sel',i===menu.i));}
function menuNav(){if(!menu)return;const n=menu.items.length;const step=d=>{let j=menu.i;for(let k=0;k<n;k++){j=(j+d+n)%n;if(!menu.items[j].disabled){menu.i=j;break;}}sfx('menu');markSel();};
  if(pressed('down'))step(1);if(pressed('up'))step(-1);
  if(pressed('jump')||pressed('confirm')||pressed('attack')){const it=menu.items[menu.i];if(it&&!it.disabled){sfx('menu');it.action();}}
  else if((pressed('pause')||pressed('dash'))&&menu&&menu.back)menu.back();}
// pause
function openPause(){state='pause';openMenu(T('paused'),[
  {label:T('resume'),action:resume},
  {label:T('map'),action:()=>{closeMenu();openMap();}},
  {label:T('sound')+': '+(AU.on?T('on'):T('off')),action:()=>{setSound(!AU.on);openPause();}},
  {label:T('lang')+': '+(LANG==='en'?'English':'Italiano'),action:()=>{setLang(LANG==='en'?'it':'en');openPause();}},
  {label:T('controls'),action:()=>{openMenu(T('controls'),[{label:T('resume'),action:()=>openPause()}],{html:'<div class="controls">'+T('ctrlText')+'</div>',back:()=>openPause()});}},
  {label:T('quit'),action:()=>{closeMenu();writeSave();toTitle();}}],{back:resume});}
function resume(){closeMenu();state='play';}
// map
function roomLayout(){if(roomLayout.c)return roomLayout.c;const pos={toychest:{x:0,y:0}};const q=['toychest'];const size=id=>({w:ROOMS[id].map[0].length,h:ROOMS[id].map.length});
  const cells=(id,d)=>{const m=ROOMS[id].map;const out=[];m.forEach((r,y)=>{for(let x=0;x<r.length;x++)if(r[x]===d)out.push({x,y});});return out;};
  while(q.length){const id=q.shift();const s=size(id);for(const d in ROOMS[id].links){const [t,td]=ROOMS[id].links[d];if(pos[t])continue;const a=cells(id,d),b=cells(t,td);const ts=size(t);
    const ea=a[0].x===0?'L':a[0].x===s.w-1?'R':a[0].y===0?'T':'B';let nx,ny;
    if(ea==='R'){nx=pos[id].x+s.w;ny=pos[id].y+Math.max(...a.map(c=>c.y))-Math.max(...b.map(c=>c.y));}
    else if(ea==='L'){nx=pos[id].x-ts.w;ny=pos[id].y+Math.max(...a.map(c=>c.y))-Math.max(...b.map(c=>c.y));}
    else if(ea==='T'){ny=pos[id].y-ts.h;nx=pos[id].x+Math.min(...a.map(c=>c.x))-Math.min(...b.map(c=>c.x));}
    else{ny=pos[id].y+s.h;nx=pos[id].x+Math.min(...a.map(c=>c.x))-Math.min(...b.map(c=>c.x));}
    pos[t]={x:nx,y:ny};q.push(t);}}
  roomLayout.c=pos;return pos;}
function openMap(){state='map';const pos=roomLayout();let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const id in pos){const r=ROOMS[id];minx=Math.min(minx,pos[id].x);miny=Math.min(miny,pos[id].y);maxx=Math.max(maxx,pos[id].x+r.map[0].length);maxy=Math.max(maxy,pos[id].y+r.map.length);}
  const sc=2,pad=6;const c=mkCanvas((maxx-minx)*sc+pad*2,(maxy-miny)*sc+pad*2);const x=c.getContext('2d');
  for(const id in pos){if(!S.visited[id])continue;const r=ROOMS[id];const ox=(pos[id].x-minx)*sc+pad,oy=(pos[id].y-miny)*sc+pad;const A=AREAS[r.area];
    r.map.forEach((row,ty)=>{for(let tx=0;tx<row.length;tx++){const ch=row[tx];if(ch==='#')continue;x.fillStyle=ch==='='?A.top:A.bg3;x.fillRect(ox+tx*sc,oy+ty*sc,sc,sc);}});
    r.map.forEach((row,ty)=>{for(let tx=0;tx<row.length;tx++){if(row[tx]==='B'){x.fillStyle='#ffe9a0';x.fillRect(ox+tx*sc-1,oy+ty*sc-1,4,4);}}});
    if(id===room.id){x.fillStyle='#fff';x.fillRect(ox+Math.floor(P.x/TS)*sc-1,oy+Math.floor(P.y/TS)*sc-1,5,5);x.strokeStyle='#e2b24c';x.lineWidth=1;x.strokeRect(ox-0.5,oy-0.5,r.map[0].length*sc+1,r.map.length*sc+1);}}
  openMenu(T('map'),[{label:T('resume'),action:closeMap}],{back:closeMap});const box=$('modalbox');const wrap=document.createElement('div');wrap.id='mapbox';
  c.style.width=Math.min(c.width*2,window.innerWidth*0.82)+'px';wrap.appendChild(c);const lg=document.createElement('div');lg.className='legend';lg.textContent=T('mapLegend');wrap.appendChild(lg);box.insertBefore(wrap,box.children[1]);}
function closeMap(){closeMenu();state='play';}
// shop
const SHOP=[{id:'spool',price:200},{id:'cog',price:260},{id:'pin',price:380}];
function openShop(){state='shop';const items=SHOP.map(s=>{const sold=S.shop[s.id];const [n,d]=T('shopItems')[s.id];return {cls:'shopitem',disabled:sold||S.buttons<s.price,
    html:`<span class="n">${n}</span><span class="p">${sold?T('sold'):s.price}</span><span class="d">${d}</span>`,action:()=>buy(s)};});
  items.push({label:T('leave'),action:closeShop});openMenu(T('shop'),items,{html:`<div class="wallet">${T('wallet')}: ${S.buttons}</div>`,back:closeShop});}
function buy(s){if(S.shop[s.id]||S.buttons<s.price)return;S.buttons-=s.price;S.shop[s.id]=1;sfx('pickup');
  if(s.id==='cog'){S.maxhp++;S.hp=S.maxhp;}if(s.id==='pin')S.dmg=2;if(s.id==='spool')S.healTime=28;writeSave();openShop();}
function closeShop(){closeMenu();state='play';}
// story slides
let slides=null;
function playSlides(lines,endTitle,cb){state='slides';slides={lines,i:0,endTitle,cb,t:0};$('slides').hidden=false;$('slides').querySelector('.tap').textContent=T('tap');showSlide();}
function showSlide(){const p=$('slides').querySelector('p');const last=slides.i>=slides.lines.length;p.className=last?'end':'';p.textContent=last?slides.endTitle:slides.lines[slides.i];p.style.opacity=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>p.style.opacity=1));slides.t=30;}
function nextSlide(){if(!slides||slides.t>0)return;slides.i++;const max=slides.lines.length+(slides.endTitle?1:0);if(slides.i>=max){$('slides').hidden=true;const cb=slides.cb;slides=null;cb&&cb();return;}showSlide();}
function slidesUpdate(){if(slides.t>0)slides.t--;if(confirmPressed())nextSlide();}
$('slides').addEventListener('pointerdown',e=>{nextSlide();e.preventDefault();});
// ending
function primaEnding(){setTheme('attic');setTimeout(()=>{startDialog(T('names').prima,T('talk').prima,()=>{state='choice';openMenu('',[
  {label:T('choiceA'),action:()=>finish('A')},{label:T('choiceB'),action:()=>finish('B')}]);});},900);}
function finish(which){closeMenu();S.ending=which;S.flags.done=1;writeSave();setTheme(which==='A'?'nursery':'boss');
  playSlides(which==='A'?T('endA'):T('endB'),which==='A'?T('endATitle'):T('endBTitle'),()=>{playSlides([T('thanks')],null,()=>{toTitle();});});}
// title
function setLang(l){LANG=l;store('wound-lang',l);document.documentElement.lang=l;
  document.querySelectorAll('.tb').forEach(el=>el.textContent=T('touch')[el.dataset.b]);if(state==='title')buildTitle();}
function buildTitle(){$('tsub').textContent=T('sub');$('thint').textContent=T('hint');const has=!!readSave();
  const m=$('tmenu');m.innerHTML='';const items=[];if(has)items.push({label:T('cont'),action:continueGame});items.push({label:T('newGame'),action:newGame});
  items.forEach((it,idx)=>{const b=document.createElement('button');b.className='btn';b.textContent=it.label;b.onclick=()=>{audioInit();it.action();};b.onpointerenter=()=>{menu.i=idx;markSel();};m.appendChild(b);it.el=b;});
  menu={items,i:0};markSel();
  const lg=$('tlang');lg.innerHTML='';for(const [code,name] of [['en','English'],['it','Italiano']]){const b=document.createElement('button');b.className='btn'+(LANG===code?' sel':'');b.textContent=name;b.style.minHeight='36px';
    b.onclick=()=>{setLang(code);};lg.appendChild(b);}}
function toTitle(){state='title';$('title').hidden=false;$('modal').hidden=true;$('dialog').hidden=true;$('card').hidden=true;setTheme('attic');buildTitle();}
function newGame(){S=freshSave();store(SAVE_KEY,'');$('title').hidden=true;menu=null;setTheme('silent');lastArea=null;
  playSlides(T('intro'),null,()=>{enterRoom('toychest',null);fx.fadeDir=-1;fx.fade=1;state='play';setTimeout(()=>{if(state==='play'&&!S.flags.patchMet)talkTo('patch');},1400);});}
function continueGame(){const s=readSave();if(!s)return newGame();S=Object.assign(freshSave(),s);if(s.lang)setLang(s.lang);$('title').hidden=true;menu=null;lastArea=null;
  if(S.ending){S.ending=null;}
  const b=S.bench;if(b)enterRoom(b.room,{pos:{x:b.x,y:b.y}});else enterRoom('toychest',null);S.hp=S.maxhp;fx.fade=1;fx.fadeDir=-1;state='play';
  if(!S.flags.patchMet)setTimeout(()=>{if(state==='play')talkTo('patch');},1200);}

// ===== MAIN LOOP =====
function update(){readInput();
  if(state==='title'){if(menu)menuNav();return;}
  if(state==='slides'){slidesUpdate();return;}
  if(state==='dialog'){dialogUpdate();return;}
  if(state==='card'){cardUpdate();return;}
  if(['pause','map','shop','choice'].includes(state)){menuNav();if(state==='map'&&pressed('map'))closeMap();return;}
  if(bossCardT>0){bossCardT--;if(bossCardT===0)$('card').hidden=true;}
  if(pressed('pause')){openPause();return;}if(pressed('map')){openMap();return;}
  // fade
  if(fx.fadeDir){fx.fade=clamp(fx.fade+fx.fadeDir*0.09,0,1);if(fx.fade>=1&&pendingLink){finishLink();}else if(fx.fade>=1&&fx.fadeDir>0&&!P.dead&&P.respawnT===0){fx.fadeDir=-1;}if(fx.fade<=0&&fx.fadeDir<0)fx.fadeDir=0;}
  if(pendingLink)return;
  if(fx.hitstop>0){fx.hitstop--;return;}
  if(tryInteract())return;
  playerUpdate();if(state!=='play')return;
  for(const e of room.ents)if(!e.dead)updateEnemy(e);room.ents=room.ents.filter(e=>!e.dead);
  updateBoss();updateProj();updateItems();updateCam();
  if(fx.shake>0)fx.shake*=0.86;if(fx.shake<0.3)fx.shake=0;if(fx.flash>0)fx.flash--;}
function render(){frame++;if(state==='title'||!room){ctx.fillStyle='#0c0a11';ctx.fillRect(0,0,W,H);return;}
  ctx.save();if(fx.shake)ctx.translate(Math.round(rnd(-fx.shake,fx.shake)),Math.round(rnd(-fx.shake,fx.shake)));
  drawBackdrop();drawTiles();drawProps();drawItems();for(const e of room.ents)drawEnemy(e);drawBoss();drawPlayer();drawProj();drawParts();drawDust();ctx.restore();
  drawLighting();drawHUD();drawBossBar();
  if(fx.flash>0){ctx.fillStyle=`rgba(255,240,220,${fx.flash/30})`;ctx.fillRect(0,0,W,H);}
  if(fx.fade>0){ctx.fillStyle=`rgba(12,10,17,${fx.fade})`;ctx.fillRect(0,0,W,H);}}
let acc=0,lastT=0;
function loop(t){const dt=Math.min(100,t-(lastT||t));lastT=t;acc+=dt;let n=0;while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}if(n===4)acc=0;render();requestAnimationFrame(loop);}
function fit(){const w=innerWidth,h=innerHeight;const s=Math.min(w/W,h/H);const wrap=$('wrap');wrap.style.width=Math.floor(W*s)+'px';wrap.style.height=Math.floor(H*s)+'px';
  document.documentElement.style.fontSize=Math.max(12,Math.min(18,s*5))+'px';}
addEventListener('resize',fit);
// boot
(function boot(){const l=load('wound-lang');setLang(l==='it'||l==='en'?l:((navigator.language||'').startsWith('it')?'it':'en'));
  const snd=load('wound-sound');if(snd==='0')AU.on=false;
  drawKeyArt($('keyart'));setupTouch();fit();toTitle();requestAnimationFrame(loop);
  const hot=window.claude&&window.claude.hot;if(hot&&hot.snapshot)hot.snapshot(()=>({S,room:room&&room.id,x:P.x,y:P.y,state}));
  const start=(d)=>{if(d&&d.S&&d.room&&d.state&&d.state!=='title'&&d.state!=='slides'){S=Object.assign(freshSave(),d.S);$('title').hidden=true;menu=null;enterRoom(d.room,{pos:{x:d.x,y:d.y}});state='play';}};
  if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data);})();
</script>

</body></html>
