/* Layout: console a schermo singolo — stato in alto, viewport del dungeon al centro, messaggi e comandi touch in basso; finestre modali in stile menu JRPG */
:root{
  --ink:#060918;
  --win-top:#2c40a8;
  --win-bot:#0f1850;
  --rule:#e3e9ff;
  --text:#f3f5ff;
  --muted:#a9b6ea;
  --hp:#72e38f;
  --mp:#74c6ff;
  --danger:#ff6f7d;
  --gold:#ffd46e;
  --poison:#c08cff;
  --cjk:"Fusion Pixel ZH";
  --f-display:"Pixelify Sans",var(--cjk),"Courier New",monospace;
  --f-body:"VT323",var(--cjk),"Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:20px;line-height:1.1;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;max-width:780px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.win{background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:2px solid var(--rule);border-radius:6px;box-shadow:inset 0 0 0 2px #0a1240,0 3px 0 #000}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:7px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;box-sizing:border-box}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
#hName{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.lv{color:var(--gold);font-size:17px;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar{display:grid;grid-template-columns:24px 1fr 62px;align-items:center;gap:6px}
.lbl{font-size:16px;color:var(--muted);letter-spacing:.08em}
.track{height:9px;background:#070b26;border:1px solid #6d7bc4;border-radius:2px;overflow:hidden;position:relative}
.track i{display:block;height:100%;width:100%;background:var(--hp);transition:width .2s}
.bar.mp .track i{background:var(--mp)}
.bar.xp .track{height:4px}
.bar.xp .track i{background:var(--gold)}
.bar.low .track i{background:var(--danger)}
.num{font-variant-numeric:tabular-nums;text-align:right;font-size:17px}
.floor{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.floor b{font-family:var(--f-display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.gold-n{color:var(--gold);font-size:17px;font-variant-numeric:tabular-nums}
.status{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.status:empty{display:none}
.chip{font-size:16px;padding:0 6px;border:1px solid currentColor;border-radius:3px;letter-spacing:.04em}
.chip.poison{color:var(--poison)}.chip.guard{color:var(--mp)}.chip.shard{color:#7fe0ff}.chip.combo{color:var(--gold)}.chip.daily{color:#ff9fb0}

/* Stage */
#stage{position:relative;flex:1;min-height:170px;border:2px solid var(--rule);border-radius:6px;overflow:hidden;background:#04060f;box-shadow:0 3px 0 #000}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#bossbar{position:absolute;top:8px;left:8px;right:84px;max-width:320px;box-sizing:border-box;padding:5px 10px;display:flex;flex-direction:column;gap:4px;pointer-events:none}

"guide.0.t":"Se déplacer et combattre",
"guide.0.b":"Déplacez-vous avec la croix directionnelle ou touchez un point de la carte. Pour attaquer, avancez sur un ennemi. Les ennemis n'agissent qu'après vous : chaque pas est un tour, prenez votre temps.",
"guide.1.t":"Points faibles",
"guide.1.b":"Chaque ennemi craint le feu, la glace ou la foudre : sur ce point faible, il subit le double de dégâts. Certains absorbent un élément. Touchez un ennemi de loin pour l'étudier : le Bestiaire garde vos découvertes.",
"guide.2.t":"Devenir plus fort",
"guide.2.b":"À chaque niveau, choisissez un don. Récupérez de l'équipement dans les coffres et sur les ennemis féroces, dépensez votre or chez le marchand et cherchez les huit éclats du Cristal. Dès l'étage 3, certains coffres mordent.",
"guide.3.t":"Boss et cases lumineuses",
"guide.3.b":"Des boss vous attendent aux étages 3, 6 et 9, et le Gardien à l'étage 10. Quand un boss se prépare, les cases qu'il va frapper s'illuminent : vous avez un tour pour en sortir.",
"guide.4.t":"Chemins, objectifs, autels",
"guide.4.b":"Au début de chaque acte, vous choisissez entre deux chemins, chacun avec ses monstres, ses dangers et son boss. Chaque étage a un objectif facultatif. Les autels échangent PV ou or contre de la puissance.",

"guide.0.t":"Bewegen und kämpfen",
"guide.0.b":"Bewege dich mit dem Steuerkreuz oder tippe auf eine Stelle der Karte. Zum Angreifen lauf in einen Gegner hinein. Gegner handeln erst nach dir: Jeder Schritt ist eine Runde, also nimm dir Zeit.",
"guide.1.t":"Schwachstellen",
"guide.1.b":"Jeder Gegner fürchtet Feuer, Eis oder Blitz: An dieser Schwachstelle erleidet er doppelten Schaden. Manche absorbieren stattdessen ein Element. Tippe einen Gegner aus der Ferne an, um ihn zu studieren: Das Bestiarium merkt sich alles.",
"guide.2.t":"Stärker werden",
"guide.2.b":"Mit jeder Stufe wählst du ein Talent. Hol dir Ausrüstung aus Truhen und von Elitegegnern, gib Gold beim Händler aus und suche die acht Kristallsplitter. Ab Etage 3 beißen manche Truhen.",
"guide.3.t":"Bosse und leuchtende Felder",
"guide.3.b":"Bosse warten auf den Etagen 3, 6 und 9, der Wächter auf Etage 10. Wenn ein Boss ausholt, leuchten die Felder auf, die er treffen wird: du hast eine Runde, um sie zu verlassen.",
"guide.4.t":"Wege, Ziele, Altäre",
"guide.4.b":"Zu Beginn jedes Akts wählst du zwischen zwei Wegen, jeder mit eigenen Monstern, Gefahren und Boss. Jede Etage hat ein optionales Ziel. Altäre tauschen LP oder Gold gegen Macht.",

"guide.0.t":"移动与战斗",
"guide.0.b":"用方向键移动，或点击地图上的位置。朝敌人移动即可攻击。敌人只在你之后行动：每一步都是一个回合，慢慢思考。",
"guide.1.t":"弱点",
"guide.1.b":"每个敌人都害怕火、冰或雷中的一种：攻击弱点造成双倍伤害。有些敌人则会吸收某种元素。远距离点击敌人可进行研究，图鉴会记录你的发现。",
"guide.2.t":"变得更强",
"guide.2.b":"每次升级都能选择一项天赋。从宝箱和狂暴敌人身上获得装备，在商人处花费金币，并寻找八块水晶碎片。从第 3 层起，有些宝箱会咬人。",
"guide.3.t":"首领与发光格子",
"guide.3.b":"首领在第 3、6、9 层等着你，守护者在第 10 层。首领蓄力时，它将攻击的格子会亮起：你有一回合时间离开。",
"guide.4.t":"道路、目标、祭坛",
"guide.4.b":"每一幕开始时，你要在两条道路中选择其一，每条都有自己的怪物、危险和首领。每层都有一个可选目标。祭坛可以用生命或金币换取力量。",

 g.gain.setValueAtTime(vol,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+dur);o.connect(g).connect(sfxG);o.start(tt);o.stop(tt+dur+.03);

 if(want!==curSong){curSong=want;musStep=0;musNext=AC.currentTime+.05}
 const S=SONGS[curSong],dt=60/S.bpm/2;if(musNext<AC.currentTime)musNext=AC.currentTime+.02;
 const pat=[0,1,2,1,0,2,1,2];
 while(musNext<AC.currentTime+.25){
  const ch=S.prog[Math.floor(musStep/8)%4];
  noteAt(mf(ch[pat[musStep%8]]+12),dt*.9,S.lead,S.boss?.02:.026,musNext);
  if(musStep%4===0)noteAt(mf(ch[0]-12),dt*3.6,"triangle",.07,musNext);

  musNext+=dt;musStep++;
 }
}

function computeFov(){
 vis.fill(0);const p=G.p,R=hasMod("buio")?4:7;
 for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
  if(dx*dx+dy*dy>R*R+R)continue;const tx=p.x+dx,ty=p.y+dy;if(tx<0||ty<0||tx>=W||ty>=H)continue;
  let x=p.x,y=p.y;const sx=Math.sign(dx),sy=Math.sign(dy),ax=Math.abs(dx),ay=Math.abs(dy);let err=ax-ay;
  for(;;){const k=I(x,y);vis[k]=1;G.ex[k]=1;if(x===tx&&y===ty)break;if(G.map[k]===0&&!(x===p.x&&y===p.y))break;const e2=2*err;if(e2>-ay){err-=ay;x+=sx}if(e2<ax){err+=ax;y+=sy}}
 }
}

 for(let h=0;h<q.length;h++){const k=q[h],x=k%W,y=(k/W)|0;
  for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=I(nx,ny);if(dist[nk]>=0||G.map[nk]===0)continue;dist[nk]=dist[k]+1;if(dist[nk]<30)q.push(nk)}}
}

function teleCells(m){
 const B=BOSS[m.t],p=G.p,cells=[],seen=new Set();
 const add=(x,y)=>{const k=I(x,y);if(x>=0&&y>=0&&x<W&&y<H&&G.map[k]>0&&!seen.has(k)){seen.add(k);cells.push([x,y])}};
 const ray=(x0,y0,dx,dy,len)=>{for(let k=1;k<=len;k++){const x=x0+dx*k,y=y0+dy*k;if(x<0||y<0||x>=W||y>=H||G.map[I(x,y)]===0)break;add(x,y)}};
 if(B.tele==="cross"){for(const[dx,dy]of DIRS)ray(m.x,m.y,dx,dy,6);for(const[dx,dy]of [[1,1],[1,-1],[-1,1],[-1,-1]])add(m.x+dx,m.y+dy)}
 else if(B.tele==="square"){for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(dx||dy)add(m.x+dx,m.y+dy)}
 else if(B.tele==="ring"){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(dx||dy)add(m.x+dx,m.y+dy)}
 else if(B.tele==="diamond"){for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if((dx||dy)&&Math.abs(dx)+Math.abs(dy)<=3)add(m.x+dx,m.y+dy)}
 else if(B.tele==="diag"){for(const[dx,dy]of [[1,1],[1,-1],[-1,1],[-1,-1]])ray(m.x,m.y,dx,dy,8);for(const[dx,dy]of DIRS)ray(m.x,m.y,dx,dy,1)}
 else if(B.tele==="xcross"){add(p.x,p.y);for(const[dx,dy]of [[1,1],[1,-1],[-1,1],[-1,-1]])ray(p.x,p.y,dx,dy,4)}
 else if(B.tele==="scatter"){add(p.x,p.y);for(let k=0;k<60&&cells.length<15;k++)add(p.x+rnd(-4,4),p.y+rnd(-4,4))}
 return cells;
}

function pathStep(goalFn){return pathStep1(goalFn,false)||pathStep1(goalFn,true)}
function pathStep1(goalFn,hzOk){
 const p=G.p,start=I(p.x,p.y),prev=new Int32Array(W*H).fill(-2);prev[start]=-1;const q=[start];
 for(let h=0;h<q.length;h++){const k=q[h],x=k%W,y=(k/W)|0;
  if(k!==start&&goalFn(x,y)){let c=k;while(prev[c]!==start)c=prev[c];return[(c%W)-p.x,((c/W)|0)-p.y]}
  const it=itemAt(x,y);if(k!==start&&it&&SOLID.has(it.k))continue;
  for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=I(nx,ny);
   if(prev[nk]!==-2||!G.ex[nk]||G.map[nk]===0)continue;if(G.ents.some(m=>m.x===nx&&m.y===ny))continue;
   if(G.map[nk]===3&&!hzOk&&!goalFn(nx,ny))continue;prev[nk]=k;q.push(nk)}}
 return null;
}
function exploreGoal(x,y){

  if(it.k==="gear"&&!it.seen)return true;if(it.k==="forziere"&&G.p.key)return true;if(it.k==="fonte"&&G.p.hp<G.p.mhp*.7)return true}

 if(it&&SOLID.has(it.k))return false;
 for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<W&&ny<H&&!G.ex[I(nx,ny)])return true}

 const tot=Math.round(Object.values(parts).reduce((a,b)=>a+b,0)*(1+.15*(G.asc||0))*D.dust*(1+modB));
 G.newBest=G.floor>(META.best||0)&&!G.won;
 if(G.won&&G.diff!=="story"&&(G.asc||0)>=(META.asc||0)&&(META.asc||0)<10){META.asc=(G.asc||0)+1;G.ascUnlocked=META.asc}

 G.dust={parts,tot};META.dust+=tot;META.best=Math.max(META.best||0,G.floor);if(G.won)META.wins=(META.wins||0)+1;
 if(G.floor>=5)META.unlock.cacciatrice=true;

function openOptions(){

 let armed=false;
 bindHot({tog:k=>{META[k]=!META[k];saveMeta();if(k==="vib"&&META.vib)vib(40);modal=null;openOptions()},
  lang:()=>{modal=null;openLang(false)},

/* =================== SCHERMATE INIZIALI =================== */
const fcv=$("#fcv"),fctx=fcv.getContext("2d"),low=document.createElement("canvas"),lctx=low.getContext("2d");
let stars=[],fparts=[],lastSpawn=0;
function sizeFront(){
 const d=Math.min(2,window.devicePixelRatio||1),W0=Math.max(1,innerWidth),H0=Math.max(1,innerHeight);
 fcv.width=Math.round(W0*d);fcv.height=Math.round(H0*d);
 const lw=Math.max(150,Math.min(260,Math.round(W0/3.2)));low.width=lw;low.height=Math.max(100,Math.round(lw*H0/W0));
 const R=mkRng(11);stars=Array.from({length:Math.round(lw*low.height/70)},()=>({x:Math.floor(R()*lw),y:Math.floor(R()*low.height*.68),p:R()*6.28,b:R()<.12}));
}
addEventListener("resize",()=>{if(!$("#front").hidden)sizeFront()});
const SKY=["#04051a","#080a28","#0e1138","#161748","#211c58","#2e2266","#3d2a72"];
function drawFront(){
 if($("#front").hidden)return;requestAnimationFrame(drawFront);
 const x=lctx,w=low.width,h=low.height,tn=now()/1000,wl=Math.round(h*.74),band=wl/SKY.length;
 SKY.forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,Math.floor(i*band),w,Math.ceil(band)+1)});
 for(let i=1;i<SKY.length;i++){x.fillStyle=SKY[i-1];const y=Math.floor(i*band);for(let xx=i%2;xx<w;xx+=2)x.fillRect(xx,y,1,1)}
 for(const s of stars){const a=.45+.55*Math.sin(tn*1.6+s.p);x.globalAlpha=Math.max(0,a);x.fillStyle=s.b?"#ffd46e":"#dfe6ff";x.fillRect(s.x,s.y,1,1);if(s.b&&a>.85){x.fillRect(s.x-1,s.y,3,1);x.fillRect(s.x,s.y-1,1,3)}}
 x.globalAlpha=1;
 for(let xx=0;xx<w;xx++){
  const h1=Math.round(9+5*Math.sin(xx*.06)+3*Math.sin(xx*.17+1));x.fillStyle="#15123a";x.fillRect(xx,wl-h1,1,h1);
  const h2=Math.round(4+3*Math.sin(xx*.11+2)+(xx%23<3?5:0));x.fillStyle="#0b0a26";x.fillRect(xx,wl-h2,1,h2);
 }
 const cx=Math.round(w*(window.__frontCx||.5)),top=Math.round(h*.43),tw=Math.max(18,Math.round(w*.14));
 const half=y=>Math.round((tw*.55+tw*.45*((y-top)/(wl-top)))/2);
 for(let y=top;y<wl;y++){const hw=half(y);x.fillStyle=(y-top)%10===0?"#1a1642":"#0a0920";x.fillRect(cx-hw,y,hw*2,1);x.fillStyle="#26225e";x.fillRect(cx-hw,y,1,1);x.fillStyle="#060514";x.fillRect(cx+hw-1,y,1,1)}
 const h0=half(top);x.fillStyle="#0a0920";for(let i=-h0;i<h0;i+=3)x.fillRect(cx+i,top-2,2,2);
 for(let i=0;i<7;i++){const ww=7-i;x.fillRect(cx-Math.floor(ww/2),top-3-i,ww,1)}
 const R=mkRng(5);for(let i=0;i<16;i++){const y=top+5+Math.floor(R()*(wl-top-9)),hw=half(y),wx=cx-hw+2+Math.floor(R()*Math.max(1,hw*2-4));x.fillStyle=Math.sin(tn*.6+i*1.9)>-.2?"#ffd46e":"#221e48";x.fillRect(wx,y,1,2)}
 const cyc=top-26+Math.round(Math.sin(tn*1.2)*1.5);
 const g=x.createRadialGradient(cx,cyc+6,1,cx,cyc+6,28);g.addColorStop(0,`rgba(127,224,255,${.45+.15*Math.sin(tn*2)})`);g.addColorStop(1,"rgba(127,224,255,0)");x.fillStyle=g;x.fillRect(cx-30,cyc-24,60,60);
 for(let r=0;r<13;r++){const hw=r<6?r:12-r;for(let c=-hw;c<=hw;c++){x.fillStyle=c===0?"#ffffff":c<0?"#9fe9ff":"#3fa8d8";x.fillRect(cx+c,cyc+r,1,1)}}
 [0,1,1,0,-1,0,1,0,-1].forEach((o,i)=>{x.fillStyle="#0a2a44";x.fillRect(cx+o,cyc+2+i,1,1)});
 if(tn-lastSpawn>.12){lastSpawn=tn;fparts.push({x:cx+(Math.random()-.5)*8,y:cyc+8,vx:(Math.random()-.5)*6,vy:2+Math.random()*4,l:0})}
 fparts=fparts.filter(p=>p.y<h&&p.l<9);
 for(const p of fparts){p.l+=1/60;p.x+=p.vx/60;p.y+=p.vy/60*(1+p.l);x.globalAlpha=Math.max(0,1-p.l/9);x.fillStyle=p.y>wl?"#3fa8d8":"#bff2ff";x.fillRect(Math.round(p.x),Math.round(p.y),1,1)}
 x.globalAlpha=1;
 for(let y=wl;y<h;y++){x.fillStyle=(y-wl)/Math.max(1,h-wl)<.5?"#0b1638":"#070c24";x.fillRect(0,y,w,1)}
 x.globalAlpha=.4;for(let y=wl+1;y<h;y++){const sy=wl-Math.round((y-wl)*1.3)-1;if(sy<0)break;const off=Math.round(Math.sin(tn*2.2+y*.7)*(1+(y-wl)*.05));x.drawImage(low,0,sy,w,1,off,y,w,1)}
 x.globalAlpha=.5;x.fillStyle="#4a6ab0";for(let i=0;i<10;i++){const y=wl+2+((i*7+Math.floor(tn*3))%Math.max(1,h-wl-2)),xx=Math.round((i*37+tn*8)%w);x.fillRect(xx,y,3+(i%3),1)}
 x.globalAlpha=1;x.fillStyle="#1f3570";x.fillRect(0,wl,w,1);
 fctx.imageSmoothingEnabled=false;fctx.drawImage(low,0,0,fcv.width,fcv.height);
}
function showFront(which){
 stopAuto();G=null;modal=null;$("#modal").hidden=true;$("#end").hidden=true;$("#tip").hidden=true;
 const was=$("#front").hidden;$("#front").hidden=false;curFront=which;
 $("#fPress").hidden=which!=="press";$("#fWrap").hidden=which==="press";$("#fMenu").hidden=which!=="menu";$("#fClass").hidden=which!=="class";

}

function renderMenu(focus){
 $("#metaRow").innerHTML=`<span>${t("menu.record")} <b>${t("menu.recordN",{n:META.best||0,m:FINAL})}</b></span><span>${t("menu.wins")} <b>${META.wins||0}</b></span><span class="dust">${t("menu.dust")} <b>${META.dust}</b></span>`;
 const r=loadRun();$("#mContinue").hidden=!r;
 if(r&&CLASSES[r.cls])$("#mContD").textContent=t("menu.contD",{c:clsName(r.cls),lv:r.p.lv,n:r.floor,m:FINAL})+(r.daily?" · "+t("chip.daily"):"");
 $("#mBestD").textContent=t("menu.bestD",{n:BEASTS.filter(k=>META.slain[k]).length,m:BEASTS.length});

function dustMult(){
 if(selDaily)return 1+dailyMods().reduce((a,id)=>a+MODS.find(m=>m.id===id).b,0);
 const D=DIFFS[META.diffSel]||DIFFS.normal,a=META.diffSel==="story"?0:Math.min(META.ascSel||0,META.asc||0);
 return D.dust*(1+.15*a)*(1+(META.mods||[]).reduce((s,id)=>s+((MODS.find(m=>m.id===id)||{b:0}).b),0));
}
function renderRunSetup(){
 const el=$("#setupRow");
 if(selDaily){const dm=dailyMods();el.innerHTML=`<span class="sec">${t("mods.daily")}</span><span class="muted" style="font-size:18px">${dm.map(id=>`<b style="color:var(--text);font-weight:400">${t("mod."+id)}</b>: ${t("mod."+id+".d")}`).join("<br>")}</span><span class="dust-line">${t("mods.total",{x:dustMult().toFixed(2)})}</span>`;return}
 const ds=["story","normal","nightmare"],cur=DIFFS[META.diffSel]?META.diffSel:"normal",mods=META.mods||[];
 el.innerHTML=`<span class="sec">${t("diff.title")}</span><div class="seg">${ds.map(d=>`<button class="seg-b" id="diff-${d}" aria-pressed="${d===cur}">${t("diff."+d)}</button>`).join("")}</div><span class="muted" style="font-size:17px">${t("diff."+cur+".d")}</span>
  <span class="sec">${t("mods.title")}</span><span class="muted" style="font-size:17px">${t("mods.intro")}</span><div class="mods">${MODS.map(m=>`<button class="mod-b" id="mod-${m.id}" aria-pressed="${mods.includes(m.id)}"><b>${t("mod."+m.id)}</b> <small>+${Math.round(m.b*100)}%</small><span>${t("mod."+m.id+".d")}</span></button>`).join("")}</div>
  <span class="dust-line">${t("mods.total",{x:dustMult().toFixed(2)})}</span>`;
 ds.forEach(d=>{$("#diff-"+d).onclick=()=>{META.diffSel=d;saveMeta();sfx("pick");renderRunSetup();renderAsc()}});
 MODS.forEach(m=>{$("#mod-"+m.id).onclick=()=>{const s=new Set(META.mods||[]);s.has(m.id)?s.delete(m.id):s.add(m.id);META.mods=[...s];saveMeta();sfx("pick");renderRunSetup()}});
}
function renderAsc(){
 const el=$("#ascRow"),mx=META.asc||0;el.hidden=selDaily||mx<1||META.diffSel==="story";if(el.hidden)return;
 const a=Math.min(META.ascSel||0,mx);
 el.innerHTML=`<span class="sec">${t("asc.title")}</span><div class="row"><button class="btn small" id="ascM" aria-label="−" ${a<=0?"disabled":""}>−</button><b class="asc-n">${a}</b><button class="btn small" id="ascP" aria-label="+" ${a>=mx?"disabled":""}>+</button><span class="muted" style="flex:1;min-width:0;font-size:17px">${a?t(a>=3?"asc.descMore":"asc.desc",{hp:a*10,atk:Math.floor(a/2),dust:a*15}):t("asc.normal")}</span></div>`;
 $("#ascM").onclick=()=>{META.ascSel=Math.max(0,a-1);saveMeta();renderAsc();renderRunSetup();sfx("pick")};
 $("#ascP").onclick=()=>{META.ascSel=Math.min(mx,a+1);saveMeta();renderAsc();renderRunSetup();sfx("pick")};
}

 $("#classInfo").innerHTML=`<span class="sec">${clsName(selCls)}</span><span class="muted" style="font-size:18px">${t("cls."+selCls+".role")}</span>${ABIL[selCls].map((a,i)=>`<div class="ab"><span class="mi-n">${abilName(selCls,i)}</span><span class="mi-c">${a.mp} MP</span><span class="mi-d">${abilDesc(selCls,i)}</span></div>`).join("")}`;

function renderClass(){
 const box=$("#cards");box.innerHTML="";
 if(CLASSES[selCls].unlock&&!META.unlock[selCls])selCls="spadaccino";
 $("#classTitle").textContent=selDaily?t("class.daily",{d:todayStr()}):t("class.title");
 $("#bGo").textContent=selDaily?t("class.goDaily"):t("class.go");
 Object.entries(CLASSES).forEach(([k,C])=>{
  const locked=C.unlock&&!META.unlock[k];

  b.insertAdjacentHTML("beforeend",`<span class="cn">${locked?"???":clsName(k)}</span><span class="cr">${locked?t("class.locked",{n:C.unlock}):t("cls."+k+".role")}</span><span class="cs">${locked?t("class.lockedS",{n:C.unlock}):`HP ${C.hp} · MP ${C.mp} · ${t("stl.atk")} ${C.atk} · ${t("stl.def")} ${C.def}`}</span>`);
  b.onclick=()=>{selCls=k;box.querySelectorAll(".card").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderClassInfo();sfx("pick")};

function capPlugin(n){const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return null;try{return(C.Plugins&&C.Plugins[n])||(C.registerPlugin?C.registerPlugin(n):null)}catch(e){return null}}
function vib(ms){if(!META.vib)return;try{const Hp=capPlugin("Haptics");if(Hp&&Hp.vibrate){Hp.vibrate({duration:ms}).catch(()=>{});return}if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function onBack(){
 if(modal){if(!$("#mClose").hidden)closeModal();return true}
 if(!$("#end").hidden){showFront("menu");return true}
 if(!$("#front").hidden){if(curFront==="class"){showFront("menu");return true}if(curFront==="menu"){showFront("press");return true}return false}
 if(G&&!G.over){stopAuto();openPause();return true}
 return false;
}
(()=>{const A=capPlugin("App");if(A&&A.addListener)A.addListener("backButton",()=>{if(!onBack())A.exitApp()})})();

cv.addEventListener("pointerdown",e=>{
 ac();if(!G||G.over||modal||!G.map)return;if(autoT){stopAuto();return}
 const r=cv.getBoundingClientRect();
 const tx=Math.floor(((e.clientX-r.left)*dpr-OX)/TS),ty=Math.floor(((e.clientY-r.top)*dpr-OY)/TS);
 const p=G.p,dx=tx-p.x,dy=ty-p.y;
 if(dx===0&&dy===0){if(G.map[I(tx,ty)]===2)descend();else endTurn();return}
 const fm=foes().find(m=>m.x===tx&&m.y===ty&&visible(m));if(fm&&Math.abs(dx)+Math.abs(dy)>1){inspect(fm);return}
 if(Math.abs(dx)+Math.abs(dy)===1){tryMove(dx,dy);return}
 if(tx>=0&&ty>=0&&tx<W&&ty<H&&G.ex[I(tx,ty)]&&G.map[I(tx,ty)]>0&&!foes().some(visible)){startAuto({x:tx,y:ty});return}
 if(Math.abs(dx)>=Math.abs(dy))tryMove(Math.sign(dx),0);else tryMove(0,Math.sign(dy));
});
addEventListener("pointerdown",()=>ac(),{once:true});
addEventListener("keydown",e=>{
 const k=e.key;ac();
 if(modal){
  if(k==="Escape"&&!$("#mClose").hidden){closeModal();e.preventDefault();return}
  if(/^[1-9]$/.test(k)){const b=$("#mBody").querySelector(`[data-hot="${k}"]`);if(b&&!b.disabled){b.click();e.preventDefault()}}
  return;
 }
 if(!$("#front").hidden){if(curFront==="press")pressStart();else if(k==="Escape")onBack();return}
 if(!$("#end").hidden){if(k==="Escape")onBack();return}
 if(!G||G.over||!G.map)return;
 const mv={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[k];
 if(mv){e.preventDefault();stopAuto();tryMove(mv[0],mv[1]);return}
 if(k===" "||k==="."){e.preventDefault();stopAuto();endTurn();return}
 if(/^[1-4]$/.test(k)){useAbility(+k-1);return}
 const lk=k.toLowerCase();
 if(lk==="e")return openMenu("abil");

 if(lk==="q")return useItem("pozione");
 if(lk==="x"){if(autoT)stopAuto();else startAuto("explore");return}
 if(k==="Escape"||lk==="p")return openPause();
 if(k==="Enter"||k===">")return descend();
});
